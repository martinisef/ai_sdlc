name: docs-media

# Regenerates the tutorial video (docs/public/media), GIFs and dashboard screenshots (docs/media) from this checkout with
# scripts/media/build.sh, and opens a PR when they changed. release.yml dispatches it after every publish;
# run it by hand after changing the CLI output, the dashboard or the tutorial.
# The PR is opened with GITHUB_TOKEN, so its checks do not start on their own: close and reopen it to run them.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

concurrency: docs-media

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: charmbracelet/vhs-action@v2
        with:
          install-only: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run docs:media
      - name: open a PR when the media changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add docs/public/media docs/media
          if git diff --cached --quiet; then echo "media unchanged"; exit 0; fi
          branch="docs/media-$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "docs: refresh tutorial media"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "docs: refresh tutorial media" \
            --body "Regenerated by the docs-media workflow (scripts/media/build.sh). Watch tutorial-en.mp4 and tutorial-es.mp4 before merging. Close and reopen this PR to run the checks."

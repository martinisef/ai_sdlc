name: release

# Changesets: merging PRs with .changeset/*.md opens a "Version packages" PR (bumps @morsadev/sdlc,
# regenerates the plugin and marketplace.json); merging that PR publishes to npm with provenance
# and attaches the editor extension (ai-sdlc-<version>.vsix) to the GitHub release.
# Auth: npm trusted publishing (OIDC, this workflow as the trusted publisher); no npm token.
# Run it by hand (workflow_dispatch) to rebuild the webhook image for the current version.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write
  actions: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm test
      - id: changesets
        uses: changesets/action@v2
        with:
          version: npm run version-packages
          publish: npm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Editor extension: the .vsix goes on the GitHub release that changesets just created.
      - if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p 'require("./packages/cli/package.json").version')
          npm run package:vscode
          gh release upload "@morsadev/sdlc@$v" "packages/vscode/ai-sdlc-$v.vsix" --clobber
      # Tutorial media (docs/public/media) for the new version; a release made with GITHUB_TOKEN does not trigger it.
      # Release candidates (1.0.0-rc.N, npm tag rc) leave the docs and the :latest image alone.
      - if: steps.changesets.outputs.published == 'true' && !contains(steps.changesets.outputs.publishedPackages, '-rc.')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs-media.yml --ref main
      # Webhook image (sdlc webhook) for GitLab/Bitbucket @claude, built from the version just published.
      - if: steps.changesets.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        id: version
        run: |
          v=$(node -p 'require("./packages/cli/package.json").version')
          echo "v=$v" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "latest=false" >> "$GITHUB_OUTPUT" ;; *) echo "latest=true" >> "$GITHUB_OUTPUT" ;; esac
      # The image installs the version from npm, which only appears once a staged publish is approved on npmjs.com.
      - if: steps.changesets.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 60
        run: |
          until npm view "@morsadev/sdlc@${{ steps.version.outputs.v }}" version --prefer-online >/dev/null 2>&1; do
            echo "waiting for @morsadev/sdlc@${{ steps.version.outputs.v }} on npm (approve the staged publish on npmjs.com)"
            sleep 30
          done
      - if: steps.changesets.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.changesets.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: packages/webhook
          build-args: SDLC_VERSION=${{ steps.version.outputs.v }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sdlc-webhook:${{ steps.version.outputs.v }}
            ${{ steps.version.outputs.latest == 'true' && format('ghcr.io/{0}/sdlc-webhook:latest', github.repository_owner) || '' }}

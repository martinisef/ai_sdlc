name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # the ubuntu job names are required checks on main: keep them as check (<node>)
    name: check (${{ matrix.node }}${{ matrix.os != 'ubuntu-latest' && format(', {0}', matrix.os) || '' }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '24']
        os: [ubuntu-latest]
        include:
          - node: '24'
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      # Only what ships: dev-tool advisories depend on upstream releases and should not block PRs
      - name: npm audit (published dependencies)
        run: npm audit --omit=dev --audit-level=moderate
      - name: no repository placeholders
        run: npm run check:placeholders
      - run: npm run typecheck
      - run: npm test
      - name: hooks parity (source)
        run: npm run test:bash
      - run: npm run build
      - name: hooks parity (bundle)
        run: SDLC="node plugins/ai-sdlc/bin/sdlc.mjs" bash tests/hooks/run.sh
      - name: generated plugin is up to date
        run: |
          git status --porcelain plugins .claude-plugin
          git diff --exit-code plugins .claude-plugin || { echo "::error::run \`npm run build\` and commit plugins/ and .claude-plugin/"; exit 1; }
          test -z "$(git status --porcelain plugins .claude-plugin)"
      - name: claude plugin validate
        run: npx -y @anthropic-ai/claude-code@latest plugin validate plugins/ai-sdlc && npx -y @anthropic-ai/claude-code@latest plugin validate .
      - name: npm pack + install smoke test
        run: npm run check:pack
      - name: e2e (lifecycle, Claude Code hooks, git hooks)
        run: bash scripts/e2e-claude.sh --no-live

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
      - name: examples/python-api
        working-directory: examples/python-api
        run: make test lint
      - name: examples/typescript-lib
        working-directory: examples/typescript-lib
        run: npm ci && make test lint build
      - name: examples/starter-todo
        working-directory: examples/starter-todo
        run: npm test && npm run lint

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:build

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm run build:ui && npm run build:cli
      - run: npx playwright install --with-deps chromium
      - name: dashboard end-to-end (Playwright)
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm run build:ui && npm run build:cli
      - name: build and package the extension
        run: npm run package:vscode
      - name: smoke test in VS Code (xvfb)
        run: xvfb-run -a node packages/vscode/smoke/run.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: packages/vscode/*.vsix

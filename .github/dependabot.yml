version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # must match engines.vscode in packages/vscode (Cursor runs an older VS Code base); raise both together
      - dependency-name: '@types/vscode'
      # the types follow the oldest supported Node (engines.node >=22.18), not the newest
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

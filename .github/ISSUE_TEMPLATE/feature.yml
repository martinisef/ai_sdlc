name: Feature request
description: An idea or a change in behavior
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it could work. Commands, config or skill changes are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds

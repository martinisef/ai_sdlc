# Bitbucket Pipelines para el loop AI-native.
# Repository variables (secured): ANTHROPIC_API_KEY (u OPENAI_API_KEY / CURSOR_API_KEY para ci.agent codex / cursor) · BITBUCKET_ACCESS_TOKEN (repository access token: pull requests write, repository write)
#   SDLC_PLUGIN_TOKEN (si el marketplace es privado) · JIRA_EMAIL + JIRA_API_TOKEN (si hay Jira)

# >>> stack: imagen del lenguaje (lo completa /sdlc-setup desde stacks/<lang>.md)
image: atlassian/default-image:4
# <<< stack

definitions:
  caches:
    sdlc-bands: .sdlc/bands
  steps:
    - step: &build
        name: Build, lint, test
        script:
          # >>> stack: setup del lenguaje
          # <<< stack
          - set -o pipefail
          - (make build && make lint && make test) 2>&1 | tee build.log
        after-script:
          # Triage solo si falló y estamos en un PR.
          - if [ "$BITBUCKET_EXIT_CODE" != "0" ] && [ -n "$BITBUCKET_PR_ID" ]; then
              export SDLC_PLUGIN_TOKEN_USER=x-token-auth;
              npx -y @ai-native-sdlc/cli@0 ci bootstrap && npx -y @ai-native-sdlc/cli@0 ci triage build.log || true;
            fi
    - step: &review
        name: Review del agente (REVIEW.md)
        image: node:22
        script:
          - export SDLC_PLUGIN_TOKEN_USER=x-token-auth
          - npx -y @ai-native-sdlc/cli@0 ci bootstrap
          - npx -y @ai-native-sdlc/cli@0 ci review
        artifacts:
          - review-tally.txt

pipelines:
  pull-requests:
    '**':
      - parallel:
          - step: *build
          - step: *review

  branches:
    'change/**':
      - step:
          name: Intent → spec
          image: node:22
          condition:
            changesets:
              includePaths:
                - "changes/**/intent.md"
          script:
            - export SDLC_PLUGIN_TOKEN_USER=x-token-auth
            - git config user.name "ai-sdlc-bot" && git config user.email "ai-sdlc-bot@noreply"
            - npx -y @ai-native-sdlc/cli@0 ci bootstrap
            - npx -y @ai-native-sdlc/cli@0 ci intent-to-spec
    main:
      - step: *build
      - step:
          name: Jira → merged
          image: node:22
          script:
            - npx -y @ai-native-sdlc/cli@0 ci jira-merged

  custom:
    agent-evals:
      # Programalo con un schedule (Repository settings → Pipelines → Schedules)
      - step:
          name: Agent evals
          image: node:22
          script:
            - export SDLC_PLUGIN_TOKEN_USER=x-token-auth
            - npx -y @ai-native-sdlc/cli@0 ci bootstrap
            - npx -y @ai-native-sdlc/cli@0 ci evals
    control-bands:
      # Stage 6 · ops/bands.yaml. Programalo diario. 1σ log · 2σ diagnóstico read-only · 3σ intent de incidente (+ PR draft si se rutea).
      - step:
          name: Control bands
          image: node:22
          caches:
            - sdlc-bands
          script:
            - export SDLC_PLUGIN_TOKEN_USER=x-token-auth
            - git config user.name "ai-sdlc-bot" && git config user.email "ai-sdlc-bot@noreply"
            - npx -y @ai-native-sdlc/cli@0 ci bootstrap
            - npx -y @ai-native-sdlc/cli@0 bands check
    sdlc-mention:
      # @claude en comentarios del PR: lo corre `sdlc webhook` vía API. Sacalo si el workspace no corre el servicio.
      - variables:
          - name: PR_NUMBER
          - name: BASE_REF
          - name: HEAD_REF
          - name: SDLC_MENTION_AUTHOR
          - name: SDLC_MENTION_BODY
      - step:
          name: Agent reply (@claude)
          image: node:22
          script:
            - export SDLC_PLUGIN_TOKEN_USER=x-token-auth
            - git config user.name "ai-sdlc-bot" && git config user.email "ai-sdlc-bot@noreply"
            - npx -y @ai-native-sdlc/cli@0 ci bootstrap
            - npx -y @ai-native-sdlc/cli@0 ci mention

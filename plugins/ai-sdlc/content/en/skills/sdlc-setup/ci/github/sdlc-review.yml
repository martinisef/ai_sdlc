name: Claude review
# Automated review of every PR with REVIEW.md (`sdlc ci review`: one finder per pass, a verifier that votes,
# inline comments and a summary that starts with the counts) + replies to @claude mentions in comments.
# The sdlc/review commit status fails while an Important finding is open (or a security finding, with
# sdlc-security.yml). A finding closes when the next round sees it fixed, or when a maintainer replies
# "resolved: <reason>" to it. Make sdlc/review a required check; approval still follows sdlc/gates.
# Not on Claude? Add --agent codex|cursor to `ci review` and pass OPENAI_API_KEY / CURSOR_API_KEY instead.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    concurrency:
      group: sdlc-review-${{ github.event.pull_request.number }}
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @morsadev/sdlc@0 ci bootstrap
      - name: Review (finders, verifier, sdlc/review)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SDLC_NOTIFY_WEBHOOK: ${{ secrets.SDLC_NOTIFY_WEBHOOK }}
        run: npx -y @morsadev/sdlc@0 ci review

  resolve:
    if: >-
      ((github.event_name == 'issue_comment' && github.event.issue.pull_request) || github.event_name == 'pull_request_review_comment') &&
      startsWith(github.event.comment.body, 'resolved')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recompute sdlc/review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          export HEAD_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          npx -y @morsadev/sdlc@0 ci review-status

  mention:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude handles the comment and pushes the fix to the PR branch. Never to main (branch protection).

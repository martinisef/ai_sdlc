name: Control bands
# Stage 6 · closing the loop. Deterministic detection over ops/bands.yaml (mean, σ, Western Electric rules);
# the agent only runs when a band breaks, and the tier decides how far it may go:
#   1σ log · 2σ read-only diagnosis · 3σ incident intent on change/incident-* (+ draft PR when routed to pull_request)
# Nothing here runs a runbook or deploys: those stay behind a human (/sdlc-incident).
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Single-value sources keep their history in .sdlc/bands (gitignored); the cache carries it between runs.
      - uses: actions/cache@v4
        with:
          path: .sdlc/bands
          key: sdlc-bands-${{ github.run_id }}
          restore-keys: sdlc-bands-
      - name: Check bands
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SDLC_PLUGIN_TOKEN: ${{ secrets.SDLC_PLUGIN_TOKEN }}
          # tokens your sources reference as ${VAR} in ops/bands.yaml, e.g.:
          # METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          git config user.name "ai-sdlc[bot]"
          git config user.email "ai-sdlc-bot@users.noreply.github.com"
          npx -y @ai-native-sdlc/cli@0 ci bootstrap
          npx -y @ai-native-sdlc/cli@0 bands check

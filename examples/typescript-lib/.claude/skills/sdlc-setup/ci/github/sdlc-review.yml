name: Claude review
# Automated review of every PR with REVIEW.md + replies to @claude mentions in comments.
# Findings are informational; approval still belongs to a code owner (branch protection).
# Not on Claude? Replace the review job's action with: npx -y @ai-native-sdlc/cli@0 ci review --agent codex|cursor
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Review this PR following REVIEW.md to the letter (passes Bugs, Security, Compliance).
            For Compliance, read changes/<slug>/spec.md and plan.md for the change (branch ${{ github.head_ref }}).
            Post the findings as inline comments plus a summary comment with the table by severity
            and the final line "Important: N · Nit: M". Do not approve or block the PR.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  mention:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude handles the comment and pushes the fix to the PR branch. Never to main (branch protection).

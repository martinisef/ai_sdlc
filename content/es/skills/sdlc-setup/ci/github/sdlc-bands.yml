name: Control bands
# Stage 6 · cerrar el loop. Detección determinística sobre ops/bands.yaml (media, σ, reglas de Western Electric);
# el agente solo corre cuando se rompe una banda, y el tier decide hasta dónde puede llegar:
#   1σ log · 2σ diagnóstico read-only · 3σ intent de incidente en change/incident-* (+ PR draft si se rutea a pull_request)
# Nada de esto ejecuta un runbook ni deploya: eso queda detrás de una persona (/sdlc-incident).
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Las fuentes de un solo valor guardan su historial en .sdlc/bands (gitignored); el cache lo lleva entre corridas.
      - uses: actions/cache@v4
        with:
          path: .sdlc/bands
          key: sdlc-bands-${{ github.run_id }}
          restore-keys: sdlc-bands-
      - name: Chequear bands
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SDLC_PLUGIN_TOKEN: ${{ secrets.SDLC_PLUGIN_TOKEN }}
          # tokens que tus fuentes referencian como ${VAR} en ops/bands.yaml, p. ej.:
          # METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          git config user.name "ai-sdlc[bot]"
          git config user.email "ai-sdlc-bot@users.noreply.github.com"
          npx -y @morsadev/sdlc@0 ci bootstrap
          npx -y @morsadev/sdlc@0 bands check

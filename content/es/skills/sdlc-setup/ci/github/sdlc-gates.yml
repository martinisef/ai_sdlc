name: sdlc gates
# Gates desde el PR: un comentario "/approve spec" (o "/reject plan motivo…") registra la decisión como commit
# en la rama del cambio, igual que `sdlc approve` en local. Solo owners, members y collaborators pueden decidir;
# los roles en .sdlc/config.json aceptan usuarios de GitHub como "@login".
# El commit status sdlc/gates se pone verde cuando el plan está aprobado (o el cambio va por el carril rápido):
# hacelo check requerido en la branch protection para que el código no se mergee antes de sus gates.
# Con risk.profile graded, sdlc/gates además cuenta las aprobaciones de la PR contra el nivel de riesgo (low 0,
# medium 1, high 2): cada aprobación queda atada al commit en que se dio, y la persona que dirige al agente cuenta como una.
# En ese caso poné en 0 las "required approvals" de la branch protection y dejá que decida sdlc/gates.
# Con merge queue, el job queue lleva sdlc/gates y sdlc/review al commit de la cola cuando todas las PRs del
# grupo los tienen en verde (ci.yml también corre en merge_group).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]
  merge_group:

concurrency:
  group: sdlc-gates-${{ github.event.pull_request.number || github.event.issue.number || github.event.merge_group.head_sha }}

jobs:
  status:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Nivel de riesgo (comentario fijo)
        # Con risk.agent_escalation: true, corré antes `npx -y @morsadev/sdlc@0 ci bootstrap` y pasá la clave del agente.
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        if: github.event_name == 'pull_request'
        run: npx -y @morsadev/sdlc@0 ci risk
      - name: sdlc/gates status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          SDLC_NOTIFY_WEBHOOK: ${{ secrets.SDLC_NOTIFY_WEBHOOK }}
        run: npx -y @morsadev/sdlc@0 ci gate-status

  decide:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      (contains(github.event.comment.body, '/approve ') || contains(github.event.comment.body, '/reject '))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checkout de la rama del PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr checkout ${{ github.event.issue.number }}
          echo "HEAD_REF=$(git branch --show-current)" >> "$GITHUB_ENV"
          echo "PR_AUTHOR=$(gh pr view ${{ github.event.issue.number }} --json author --jq .author.login)" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Registrar la decisión del gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          SDLC_NOTIFY_WEBHOOK: ${{ secrets.SDLC_NOTIFY_WEBHOOK }}
        run: npx -y @morsadev/sdlc@0 ci gate

  queue:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Llevar sdlc/gates y sdlc/review al commit de la cola
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        run: npx -y @morsadev/sdlc@0 ci merge-queue

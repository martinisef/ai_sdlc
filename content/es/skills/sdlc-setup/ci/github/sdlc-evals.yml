name: Agent evals
# La configuración que guía al agente (CLAUDE.md/AGENTS.md, skills, hooks) se testea como código.
# Agente: ci.agent en .sdlc/config.json (claude por defecto; codex y cursor necesitan OPENAI_API_KEY / CURSOR_API_KEY).
on:
  pull_request:
    paths: ['CLAUDE.md', 'AGENTS.md', '.claude/**', '.cursor/**', '.agents/**', '.sdlc/config.json', 'evals/**']
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # >>> stack: setup del lenguaje (igual que ci.yml)
      # <<< stack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SDLC_PLUGIN_TOKEN: ${{ secrets.SDLC_PLUGIN_TOKEN }}
          EVAL_MIN_PASS_RATE: '0.8'
        run: |
          npx -y @ai-native-sdlc/cli@0 ci bootstrap
          npx -y @ai-native-sdlc/cli@0 ci evals

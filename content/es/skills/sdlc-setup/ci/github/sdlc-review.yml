name: Claude review
# Review automático de cada PR con REVIEW.md (`sdlc ci review`: un finder por pass, un verificador que vota,
# comentarios inline y un resumen que arranca con los conteos) + respuesta a menciones @claude en comentarios.
# El commit status sdlc/review falla mientras haya un finding Important abierto (o uno de seguridad, con
# sdlc-security.yml). Un finding se cierra cuando la ronda siguiente lo ve arreglado, o cuando alguien con permisos
# responde "resolved: <razón>". Hacé de sdlc/review un check requerido; la aprobación sigue a sdlc/gates.
# ¿No usás Claude? Agregá --agent codex|cursor a `ci review` y pasá OPENAI_API_KEY / CURSOR_API_KEY.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    concurrency:
      group: sdlc-review-${{ github.event.pull_request.number }}
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @morsadev/sdlc@0 ci bootstrap
      - name: Review (finders, verificador, sdlc/review)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SDLC_NOTIFY_WEBHOOK: ${{ secrets.SDLC_NOTIFY_WEBHOOK }}
        run: npx -y @morsadev/sdlc@0 ci review

  resolve:
    if: >-
      ((github.event_name == 'issue_comment' && github.event.issue.pull_request) || github.event_name == 'pull_request_review_comment') &&
      startsWith(github.event.comment.body, 'resolved')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recalcular sdlc/review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          export HEAD_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          npx -y @morsadev/sdlc@0 ci review-status

  mention:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude atiende el comentario y pushea el fix a la rama del PR. Nunca a main (branch protection).

name: Claude review
# Review automático de cada PR con REVIEW.md + respuesta a menciones @claude en comentarios.
# Los findings informan; la aprobación sigue siendo de un code owner (branch protection).
# ¿No usás Claude? Reemplazá la action del job review por: npx -y @ai-native-sdlc/cli@0 ci review --agent codex|cursor
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Revisá este PR siguiendo REVIEW.md al pie de la letra (passes Bugs, Security, Compliance).
            Para Compliance, leé changes/<slug>/spec.md y plan.md del cambio (rama ${{ github.head_ref }}).
            Publicá los findings como comentarios inline y un comentario resumen con la tabla por severidad
            y la línea final "Important: N · Nit: M". No apruebes ni bloquees el PR.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  mention:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude atiende el comentario y pushea el fix a la rama del PR. Nunca a main (branch protection).

# Bitbucket Pipelines para el loop AI-native.
# Repository variables (secured): ANTHROPIC_API_KEY (u OPENAI_API_KEY / CURSOR_API_KEY para ci.agent codex / cursor) · BITBUCKET_ACCESS_TOKEN (repository access token: pull requests write, repository write)
#   SDLC_PLUGIN_TOKEN (si el marketplace es privado) · JIRA_EMAIL + JIRA_API_TOKEN (si hay Jira) · LINEAR_API_KEY · SDLC_NOTIFY_WEBHOOK (opcional)

# >>> stack: imagen del lenguaje (lo completa /sdlc-setup desde stacks/<lang>.md)
image: atlassian/default-image:4
# <<< stack

definitions:
  caches:
    sdlc-bands: .sdlc/bands
  steps:
    - step: &build
        name: Build, lint, test
        script:
          # >>> stack: setup del lenguaje
          # <<< stack
          - set -o pipefail
          - (make build && make lint && make test) 2>&1 | tee build.log
        after-script:
          # Triage solo si falló y estamos en un PR.
          - if [ "$BITBUCKET_EXIT_CODE" != "0" ] && [ -n "$BITBUCKET_PR_ID" ]; then
              export SDLC_PLUGIN_TOKEN_USER=x-token-auth;
              npx -y @morsadev/sdlc@0 ci bootstrap && npx -y @morsadev/sdlc@0 ci triage build.log || true;
            fi
    - step: &review
        name: Review del agente (REVIEW.md)
        image: node:22
        script:
          - export SDLC_PLUGIN_TOKEN_USER=x-token-auth
          - npx -y @morsadev/sdlc@0 ci bootstrap
          - HEAD_SHA="$BITBUCKET_COMMIT" npx -y @morsadev/sdlc@0 ci review
        artifacts:
          - review-tally.txt
          - review.json
    - step: &security
        name: Security review
        image: node:22
        script:
          - export SDLC_PLUGIN_TOKEN_USER=x-token-auth
          - npx -y @morsadev/sdlc@0 ci bootstrap
          - HEAD_SHA="$BITBUCKET_COMMIT" npx -y @morsadev/sdlc@0 ci security
        artifacts:
          - security-tally.txt
          - security.json

pipelines:
  pull-requests:
    '**':
      - parallel:
          - step: *build
          - step: *review
          - step: *security
          - step:
              name: sdlc/gates
              image: node:22
              script:
                - HEAD_REF="$BITBUCKET_BRANCH" npx -y @morsadev/sdlc@0 ci risk
                - HEAD_REF="$BITBUCKET_BRANCH" HEAD_SHA="$BITBUCKET_COMMIT" npx -y @morsadev/sdlc@0 ci gate-status

  branches:
    'change/**':
      - step:
          name: Intent → spec
          image: node:22
          condition:
            changesets:
              includePaths:
                - "changes/**/intent.md"
          script:
            - export SDLC_PLUGIN_TOKEN_USER=x-token-auth
            - git config user.name "ai-sdlc-bot" && git config user.email "ai-sdlc-bot@noreply"
            - npx -y @morsadev/sdlc@0 ci bootstrap
            - npx -y @morsadev/sdlc@0 ci intent-to-spec
    main:
      - step: *build
      - step:
          name: Tracker y avisos al mergear
          image: node:22
          script:
            - npx -y @morsadev/sdlc@0 ci tracker-merged

  custom:
    agent-evals:
      # Programalo con un schedule (Repository settings → Pipelines → Schedules)
      - step:
          name: Agent evals
          image: node:22
          script:
            - export SDLC_PLUGIN_TOKEN_USER=x-token-auth
            - npx -y @morsadev/sdlc@0 ci bootstrap
            - npx -y @morsadev/sdlc@0 ci evals
    control-bands:
      # Stage 6 · ops/bands.yaml. Programalo diario. 1σ log · 2σ diagnóstico read-only · 3σ intent de incidente (+ PR draft si se rutea).
      - step:
          name: Control bands
          image: node:22
          caches:
            - sdlc-bands
          script:
            - export SDLC_PLUGIN_TOKEN_USER=x-token-auth
            - git config user.name "ai-sdlc-bot" && git config user.email "ai-sdlc-bot@noreply"
            - npx -y @morsadev/sdlc@0 ci bootstrap
            - npx -y @morsadev/sdlc@0 bands check
    nightly-review:
      # Review nocturno del código existente, un módulo por noche (ci.nightly.modules). Programalo diario.
      # Hallazgos Important → intents (origin: review) en change/review-* + PR draft; commits revertidos → evals del reviewer.
      - step:
          name: Nightly review
          image: node:22
          clone:
            depth: full
          script:
            - export SDLC_PLUGIN_TOKEN_USER=x-token-auth
            - git config user.name "ai-sdlc-bot" && git config user.email "ai-sdlc-bot@noreply"
            - git fetch -q origin '+refs/heads/change/*:refs/remotes/origin/change/*'
            - npx -y @morsadev/sdlc@0 ci bootstrap
            - npx -y @morsadev/sdlc@0 ci nightly-review --pr
            - npx -y @morsadev/sdlc@0 ci capture-eval --reverts --since 7d
            - |
              if [ -n "$(git status --porcelain -- evals)" ]; then
                branch="evals/reviewer-$(date -u +%Y%m%d)"
                git checkout -q -b "$branch" && git add evals && git commit -qm "test(evals): reviewer evals from reverted commits"
                git push -q origin "$branch"
              fi
    sdlc-mention:
      # @claude en comentarios del PR: lo corre `sdlc webhook` vía API. Sacalo si el workspace no corre el servicio.
      - variables:
          - name: PR_NUMBER
          - name: BASE_REF
          - name: HEAD_REF
          - name: SDLC_MENTION_AUTHOR
          - name: SDLC_MENTION_BODY
      - step:
          name: Agent reply (@claude)
          image: node:22
          script:
            - export SDLC_PLUGIN_TOKEN_USER=x-token-auth
            - git config user.name "ai-sdlc-bot" && git config user.email "ai-sdlc-bot@noreply"
            - npx -y @morsadev/sdlc@0 ci bootstrap
            - npx -y @morsadev/sdlc@0 ci mention
    sdlc-gate:
      # /approve spec, /reject plan … en comentarios del PR: lo corre `sdlc webhook` por la API (SDLC_JOB=gate).
      - variables:
          - name: PR_NUMBER
          - name: BASE_REF
          - name: HEAD_REF
          - name: PR_AUTHOR
          - name: COMMENT_AUTHOR
          - name: COMMENT_AUTHOR_NAME
          - name: COMMENT_BODY
      - step:
          name: Decisión del gate
          image: node:22
          script:
            - git config user.name "ai-sdlc-bot" && git config user.email "ai-sdlc-bot@noreply"
            - git checkout -B "$HEAD_REF"
            - npx -y @morsadev/sdlc@0 ci gate
    sdlc-review-status:
      # Respuestas "resolved: <razón>" en comentarios del PR: lo corre `sdlc webhook` (SDLC_JOB=review-status). Recalcula sdlc/review.
      - variables:
          - name: PR_NUMBER
      - step:
          name: Recalcular sdlc/review
          image: node:22
          script:
            - HEAD_SHA="$BITBUCKET_COMMIT" npx -y @morsadev/sdlc@0 ci review-status
